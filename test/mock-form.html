<!doctype html><html><body>
<div role="dialog" aria-label="Easy Apply">
<form>
  <div class="fb-dash-form-element">
    <label for="phone">Mobile phone number</label>
    <input id="phone" type="text" value="">
  </div>
  <div class="fb-dash-form-element">
    <label for="email">Email address</label>
    <select id="email"><option>Select an option</option><option>test@example.com</option></select>
  </div>
  <div class="fb-dash-form-element">
    <label for="cc">Phone country code</label>
    <select id="cc"><option>Select an option</option><option>United States (+1)</option><option>India (+91)</option></select>
  </div>
  <div class="fb-dash-form-element">
    <label for="java">How many years of work experience do you have with Java?</label>
    <input id="java" type="text" inputmode="numeric">
  </div>
  <div class="fb-dash-form-element">
    <label for="kafka">How many years of work experience do you have with Apache Kafka?</label>
    <input id="kafka" type="text">
  </div>
  <div class="fb-dash-form-element">
    <label for="ctc">What is your current CTC?</label>
    <input id="ctc" type="text">
  </div>
  <div class="fb-dash-form-element">
    <fieldset>
      <legend>Are you legally authorized to work in India?</legend>
      <input type="radio" name="auth" id="auth-yes" value="Yes"><label for="auth-yes">Yes</label>
      <input type="radio" name="auth" id="auth-no" value="No"><label for="auth-no">No</label>
    </fieldset>
  </div>
  <div class="fb-dash-form-element">
    <fieldset>
      <legend>Will you now or in the future require sponsorship for employment visa status?</legend>
      <input type="radio" name="visa" id="visa-yes" value="Yes"><label for="visa-yes">Yes</label>
      <input type="radio" name="visa" id="visa-no" value="No"><label for="visa-no">No</label>
    </fieldset>
  </div>
  <div class="fb-dash-form-element">
    <label for="exp">Years of experience</label>
    <select id="exp"><option>Select an option</option><option>0-1 years</option><option>1-3 years</option><option>3-5 years</option><option>5+ years</option></select>
  </div>
  <div class="fb-dash-form-element">
    <label for="edu">Highest level of education completed</label>
    <select id="edu"><option>Select an option</option><option>High School</option><option>Bachelor's Degree</option><option>Master's Degree</option></select>
  </div>
  <div class="fb-dash-form-element">
    <fieldset>
      <legend>Do you like pineapple on pizza?</legend>
      <input type="radio" name="pizza" id="pz-y"><label for="pz-y">Yes</label>
      <input type="radio" name="pizza" id="pz-n"><label for="pz-n">No</label>
    </fieldset>
  </div>
  <div>
    <p>Do you hold US Visa or Australia Visa?</p>
    <fieldset aria-describedby="error-message-_r_3b_" role="radiogroup"><div>
      <div role="radio" tabindex="0" aria-label="Do you hold US Visa or Australia Visa?" aria-checked="false"><div><div><input id="_r_3d_" type="radio" name="radio-group-_r_3b_"><label for="_r_3d_"></label></div><div><p>Yes</p></div></div></div>
      <div role="radio" tabindex="0" aria-label="Do you hold US Visa or Australia Visa?" aria-checked="false"><div><div><input id="_r_3f_" type="radio" name="radio-group-_r_3b_"><label for="_r_3f_"></label></div><div><p>No</p></div></div></div>
    </div></fieldset>
  </div>
  <div class="fb-dash-form-element">
    <label for="cover">Why do you want to join us?</label>
    <textarea id="cover"></textarea>
  </div>
  <div class="fb-dash-form-element">
    <label for="city">City</label>
    <input id="city" type="text" value="New Delhi, Delhi, India">
  </div>
  <div class="fb-dash-form-element">
    <input type="checkbox" id="follow-company-checkbox" checked><label for="follow-company-checkbox">Follow Acme Corp to stay up to date with their page.</label>
  </div>
  <div class="fb-dash-form-element">
    <label for="resume">Upload resume</label>
    <input type="file" id="resume" accept=".pdf,.doc,.docx">
  </div>
</form>
</div>
</body></html>
